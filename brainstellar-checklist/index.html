<html lang="en" data-theme="dark">

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Catppuccin Mocha (dark) ── */
      [data-theme="dark"] {
        --bg: #1e1e2e;
        --surface: #181825;
        --surface2: #313244;
        --border: #45475a;
        --border-hover: #585b70;
        --text: #cdd6f4;
        --text-secondary: #bac2de;
        --text-faint: #6c7086;
        --accent: #89b4fa;
        --easy: #a6e3a1;
        --medium: #f9e2af;
        --hard: #fab387;
        --deadly: #f38ba8;
        --star-color: #f9e2af;
        --done-bg: #1e2a1e;
        --done-text: #6c9e6c;
        --toggle-bg: #313244;
      }

      /* ── Catppuccin Latte (light) ── */
      [data-theme="light"] {
        --bg: #eff1f5;
        --surface: #ffffff;
        --surface2: #e6e9ef;
        --border: #ccd0da;
        --border-hover: #acb0be;
        --text: #4c4f69;
        --text-secondary: #5c5f77;
        --text-faint: #8c8fa1;
        --accent: #1e66f5;
        --easy: #40a02b;
        --medium: #df8e1d;
        --hard: #fe640b;
        --deadly: #d20f39;
        --star-color: #df8e1d;
        --done-bg: #eef5ee;
        --done-text: #5a8a5a;
        --toggle-bg: #e6e9ef;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        min-height: 100vh;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }

      .page-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }

      .page-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      .theme-toggle {
        background: var(--toggle-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.38rem 0.75rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.15s;
      }

      .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }

      .stats-row {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }

      .stat-item {
        font-size: 0.88rem;
        color: var(--text-secondary);
      }

      .stat-item strong {
        color: var(--text);
        font-weight: 600;
      }

      .progress-section {
        margin-bottom: 1.5rem;
      }

      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 0.45rem;
      }

      .progress-label .pct {
        color: var(--text);
        font-weight: 600;
      }

      .progress-track {
        height: 6px;
        background: var(--surface2);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 999px;
        transition: width 0.4s ease;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 0.6rem;
        margin-bottom: 1.5rem;
      }

      .cat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 0.9rem;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
        position: relative;
        overflow: hidden;
      }

      .cat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 3px;
        height: 100%;
        background: var(--cat-color);
      }

      .cat-card:hover {
        border-color: var(--border-hover);
      }

      .cat-card.active {
        border-color: var(--cat-color);
        background: color-mix(in srgb, var(--cat-color) 10%, var(--surface));
      }

      .cat-name {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--cat-color);
        margin-bottom: 0.2rem;
      }

      .cat-progress-text {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .cat-mini-bar {
        margin-top: 0.45rem;
        height: 3px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }

      .cat-mini-fill {
        height: 100%;
        background: var(--cat-color);
        border-radius: 999px;
        transition: width 0.4s ease;
      }

      .filters {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
        align-items: center;
      }

      .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        padding: 0.35rem 0.9rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .filter-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }

      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
        font-weight: 600;
      }

      .spacer {
        flex: 1;
      }

      .clear-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-faint);
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 500;
        padding: 0.35rem 0.9rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .clear-btn:hover {
        border-color: var(--deadly);
        color: var(--deadly);
      }

      .table-header {
        display: grid;
        grid-template-columns: 36px 36px 1fr 90px 120px;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-faint);
        border-bottom: 1px solid var(--border);
        margin-bottom: 0.25rem;
      }

      .puzzle-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .puzzle-row {
        display: grid;
        grid-template-columns: 36px 36px 1fr 90px 120px;
        gap: 0.5rem;
        align-items: center;
        padding: 0.6rem 0.75rem;
        border-radius: 7px;
        background: var(--surface);
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }

      .puzzle-row:hover {
        border-color: var(--border);
        background: var(--surface2);
      }

      .puzzle-row.solved {
        background: var(--done-bg);
      }

      .puzzle-row.solved .puzzle-name {
        color: var(--done-text);
        text-decoration: line-through;
        text-decoration-color: var(--easy);
        text-decoration-thickness: 1.5px;
      }

      .puzzle-row.solved .puzzle-link a {
        color: var(--text-faint);
      }

      .check-box {
        width: 19px;
        height: 19px;
        border-radius: 5px;
        border: 1.5px solid var(--border-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        cursor: pointer;
        flex-shrink: 0;
      }

      .check-box:hover {
        border-color: var(--easy);
      }

      .puzzle-row.solved .check-box {
        background: var(--easy);
        border-color: var(--easy);
      }

      .check-icon {
        display: none;
      }

      .puzzle-row.solved .check-icon {
        display: block;
      }

      .star-btn {
        width: 26px;
        height: 26px;
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        transition: all 0.15s;
        flex-shrink: 0;
        padding: 0;
        opacity: 0.25;
      }

      .star-btn:hover {
        opacity: 0.7;
        transform: scale(1.1);
      }

      .star-btn.starred {
        opacity: 1;
      }

      .puzzle-name {
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--text);
        transition: color 0.12s;
      }

      .puzzle-link {
        font-size: 0.78rem;
        color: var(--text-faint);
        margin-top: 1px;
      }

      .puzzle-link a {
        color: var(--text-faint);
        text-decoration: none;
        transition: color 0.12s;
      }

      .puzzle-link a:hover {
        color: var(--accent);
      }

      .diff-tag {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2rem 0.55rem;
        border-radius: 5px;
        background: color-mix(in srgb, var(--d-color) 15%, transparent);
        color: var(--d-color);
        border: 1px solid color-mix(in srgb, var(--d-color) 30%, transparent);
      }

      .cat-tag {
        display: inline-block;
        font-size: 0.73rem;
        font-weight: 500;
        padding: 0.18rem 0.5rem;
        border-radius: 5px;
        background: color-mix(in srgb, var(--c-color) 12%, transparent);
        color: var(--c-color);
        border: 1px solid color-mix(in srgb, var(--c-color) 22%, transparent);
      }

      .empty-state {
        text-align: center;
        padding: 3rem;
        color: var(--text-faint);
        font-size: 0.9rem;
      }

      @media (max-width: 620px) {
        .table-header,
        .puzzle-row {
          grid-template-columns: 36px 36px 1fr 75px;
        }

        .table-header .col-cat,
        .puzzle-row .cat-tag {
          display: none;
        }
      }
    </style>
  </head>

        <div class="stat-item">

      <div class="progress-section">

      <div class="filters">

        <button class="filter-btn" data-status="starred">Starred</button>
        <div class="spacer"></div>

      // Catppuccin palette
      const DIFF_COLORS = {
        easy: "var(--easy)",
        medium: "var(--medium)",
        hard: "var(--hard)",
        deadly: "var(--deadly)",
      };
      // Use explicit hex for tags (since color-mix with CSS vars is iffy in some browsers)
      const DIFF_HEX_DARK = {
        easy: "#a6e3a1",
        medium: "#f9e2af",
        hard: "#fab387",
        deadly: "#f38ba8",
      };
      const DIFF_HEX_LIGHT = {
        easy: "#40a02b",
        medium: "#df8e1d",
        hard: "#fe640b",
        deadly: "#d20f39",
      };
      const CAT_HEX_DARK = {
        probability: "#89b4fa",
        discrete: "#94e2d5",
        strategy: "#cba6f7",
        general: "#89dceb",
      };
      const CAT_HEX_LIGHT = {
        probability: "#1e66f5",
        discrete: "#179299",
        strategy: "#8839ef",
        general: "#04a5e5",
      };

      const DIFF_LABELS = {
        easy: "Easy",
        medium: "Medium",
        hard: "Hard",
        deadly: "Deadly",
      };
      const CAT_LABELS = {
        probability: "Probability",
        discrete: "Discrete",
        strategy: "Strategy",
        general: "General",
      };

      const STORAGE_KEY = "bs_solved_v1";
      const STARRED_KEY = "bs_starred_v1";
      const STREAK_KEY = "bs_streak_v1";
      const THEME_KEY = "bs_theme_v1";

      function loadSet(key) {
        try {
          return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
        } catch {
          return new Set();
        }
      }
      function saveSet(key, s) {
        localStorage.setItem(key, JSON.stringify([...s]));
      }

      let solved = loadSet(STORAGE_KEY);
      let starred = loadSet(STARRED_KEY);
      let activeFilter = { status: "all", cat: null };

      // ── Theme ──────────────────────────────────────────────────────────────
      function isDarkMode() {
        return document.documentElement.getAttribute("data-theme") === "dark";
      }

      function getDiffHex(diff) {
        return isDarkMode() ? DIFF_HEX_DARK[diff] : DIFF_HEX_LIGHT[diff];
      }
      function getCatHex(cat) {
        return isDarkMode() ? CAT_HEX_DARK[cat] : CAT_HEX_LIGHT[cat];
      }

      const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      function updateToggleLabel() {
        const dark = isDarkMode();
        document.getElementById("theme-icon").textContent = dark ? "☀️" : "🌙";
        document.getElementById("theme-label").textContent = dark
          ? "Light"
          : "Dark";
      }
      updateToggleLabel();

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const next = isDarkMode() ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem(THEME_KEY, next);
        updateToggleLabel();
        // Re-apply tag colors (they use hex vars that depend on theme)
        applyRowStates();
        updateCatGridColors();
      });

      // ── Streak ─────────────────────────────────────────────────────────────
      function updateStreak(newCount) {
        const today = new Date().toDateString();
        const data = JSON.parse(
          localStorage.getItem(STREAK_KEY) ||
            '{"streak":0,"last":"","count":0}',
        );
        if (newCount > data.count) {
          if (data.last === today) {
          } else if (
            data.last === new Date(Date.now() - 86400000).toDateString()
          ) {
            data.streak++;
          } else {
            data.streak = 1;
          }
          data.last = today;
          data.count = newCount;
          localStorage.setItem(STREAK_KEY, JSON.stringify(data));
        }
        return JSON.parse(localStorage.getItem(STREAK_KEY) || '{"streak":0}')
          .streak;
      }

      // ── Stats ──────────────────────────────────────────────────────────────
      function computeStats() {
        const total = PUZZLES.length,
          done = solved.size;
        const pct = total ? Math.round((done / total) * 100) : 0;
        const byDiff = {},
          byCat = {};
        for (const p of PUZZLES) {
          byDiff[p.diff] = byDiff[p.diff] || { done: 0, total: 0 };
          byDiff[p.diff].total++;
          if (solved.has(p.id)) byDiff[p.diff].done++;
          byCat[p.cat] = byCat[p.cat] || { done: 0, total: 0 };
          byCat[p.cat].total++;
          if (solved.has(p.id)) byCat[p.cat].done++;
        }
        return { total, done, pct, byDiff, byCat };
      }

      function renderHeader(stats) {
        document.getElementById("hd-solved").textContent = stats.done;
        document.getElementById("hd-total").textContent = stats.total;
        document.getElementById("hd-starred").textContent = starred.size;
        document.getElementById("hd-streak").textContent = updateStreak(
          stats.done,
        );
        document.getElementById("overall-pct").textContent = stats.pct + "%";
        document.getElementById("overall-bar").style.width = stats.pct + "%";
      }

      // ── Cat grid ───────────────────────────────────────────────────────────
      function buildCatGrid() {
        const grid = document.getElementById("cat-grid");
        grid.innerHTML = "";
        const entries = [
          ...["easy", "medium", "hard", "deadly"].map((k) => ({
            key: k,
            label: DIFF_LABELS[k],
            type: "diff",
          })),
          ...["probability", "discrete", "strategy", "general"].map((k) => ({
            key: k,
            label: CAT_LABELS[k],
            type: "cat",
          })),
        ];
        for (const e of entries) {
          const card = document.createElement("div");
          card.className = "cat-card";
          card.dataset.key = e.key;
          card.dataset.type = e.type;
          card.innerHTML = `
      <div class="cat-name">${e.label}</div>
      <div class="cat-progress-text" data-cat-progress="${e.key}">0 / 0</div>
      <div class="cat-mini-bar"><div class="cat-mini-fill" data-cat-bar="${e.key}" style="width:0%"></div></div>`;
          card.addEventListener("click", () => {
            activeFilter.cat = activeFilter.cat === e.key ? null : e.key;
            updateCatGridActive();
            refreshList();
          });
          grid.appendChild(card);
        }
        updateCatGridColors();
      }

      function updateCatGridColors() {
        document.querySelectorAll(".cat-card").forEach((card) => {
          const key = card.dataset.key;
          const type = card.dataset.type;
          const color = type === "diff" ? getDiffHex(key) : getCatHex(key);
          card.style.setProperty("--cat-color", color);
        });
      }

      function updateCatGrid(stats) {
        for (const diff of ["easy", "medium", "hard", "deadly"]) {
          const s = stats.byDiff[diff] || { done: 0, total: 0 };
          const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
          const el = document.querySelector(`[data-cat-progress="${diff}"]`);
          const bar = document.querySelector(`[data-cat-bar="${diff}"]`);
          if (el) el.textContent = `${s.done} / ${s.total}`;
          if (bar) bar.style.width = pct + "%";
        }
        for (const cat of ["probability", "discrete", "strategy", "general"]) {
          const s = stats.byCat[cat] || { done: 0, total: 0 };
          const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
          const el = document.querySelector(`[data-cat-progress="${cat}"]`);
          const bar = document.querySelector(`[data-cat-bar="${cat}"]`);
          if (el) el.textContent = `${s.done} / ${s.total}`;
          if (bar) bar.style.width = pct + "%";
        }
      }

      function updateCatGridActive() {
        document
          .querySelectorAll(".cat-card")
          .forEach((card) =>
            card.classList.toggle(
              "active",
              card.dataset.key === activeFilter.cat,
            ),
          );
      }

      // ── Puzzle list (built once, updated in place) ─────────────────────────
      function buildList() {
        const list = document.getElementById("puzzle-list");
        list.innerHTML = "";
        for (const p of PUZZLES) {
          const dColor = getDiffHex(p.diff);
          const cColor = getCatHex(p.cat);
          const row = document.createElement("div");
          row.className = "puzzle-row";
          row.dataset.id = p.id;
          row.dataset.diff = p.diff;
          row.dataset.cat = p.cat;
          row.innerHTML = `
      <div class="check-box" title="Mark as solved">
        <svg class="check-icon" width="11" height="11" viewBox="0 0 12 12" fill="none">
          <polyline points="2,6 5,9 10,3" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <button class="star-btn" title="Star this puzzle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="${getCatHex("probability")}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="star-svg">
          <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
        </svg>
      </button>
      <div>
        <div class="puzzle-name">${p.name}</div>
        <div class="puzzle-link"><a href="${p.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">brainstellar.com/puzzles/${p.id} ↗</a></div>
      </div>
      <div><span class="diff-tag" data-diff-tag="${p.id}" style="--d-color:${dColor}">${DIFF_LABELS[p.diff]}</span></div>
      <div><span class="cat-tag" data-cat-tag="${p.id}" style="--c-color:${cColor}">${CAT_LABELS[p.cat]}</span></div>
    `;

          row.querySelector(".check-box").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleSolved(p.id, row);
          });
          row.querySelector(".star-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            toggleStarred(p.id, row);
          });
          row.addEventListener("click", () => toggleSolved(p.id, row));
          list.appendChild(row);
        }
        applyRowStates();
      }

      function applyRowStates(singleRow) {
        const rows = singleRow
          ? [singleRow]
          : document.querySelectorAll(".puzzle-row[data-id]");
        rows.forEach((row) => {
          const id = Number(row.dataset.id);
          const isDone = solved.has(id);
          const isStarred = starred.has(id);
          row.classList.toggle("solved", isDone);
          const starBtn = row.querySelector(".star-btn");
          const starSvg = row.querySelector(".star-svg");
          starBtn.classList.toggle("starred", isStarred);
          if (starSvg) {
            const starColor = isDarkMode()
              ? CAT_HEX_DARK.probability
              : CAT_HEX_LIGHT.probability;
            starSvg.setAttribute("stroke", starColor);
            starSvg.setAttribute("fill", isStarred ? starColor : "none");
          }
        });
      }

      function refreshList() {
        let anyVisible = false;
        document.querySelectorAll(".puzzle-row[data-id]").forEach((row) => {
          const id = Number(row.dataset.id);
          const diff = row.dataset.diff;
          const cat = row.dataset.cat;
          const catMatch =
            !activeFilter.cat ||
            diff === activeFilter.cat ||
            cat === activeFilter.cat;
          const statusMatch =
            activeFilter.status === "all" ||
            (activeFilter.status === "done" && solved.has(id)) ||
            (activeFilter.status === "todo" && !solved.has(id)) ||
            (activeFilter.status === "starred" && starred.has(id));
          const show = catMatch && statusMatch;
          row.style.display = show ? "" : "none";
          if (show) anyVisible = true;
        });
        let empty = document.getElementById("empty-state");
        if (!anyVisible) {
          if (!empty) {
            empty = document.createElement("div");
            empty.id = "empty-state";
            empty.className = "empty-state";
            empty.textContent = "No puzzles match your filters.";
            document.getElementById("puzzle-list").appendChild(empty);
          }
        } else if (empty) {
          empty.remove();
        }
      }

      function toggleSolved(id, row) {
        if (solved.has(id)) solved.delete(id);
        else solved.add(id);
        saveSet(STORAGE_KEY, solved);
        applyRowStates(row);
        if (activeFilter.status === "done" || activeFilter.status === "todo")
          refreshList();
        updateHeaderAndCards();
      }

      function toggleStarred(id, row) {
        if (starred.has(id)) starred.delete(id);
        else starred.add(id);
        saveSet(STARRED_KEY, starred);
        applyRowStates(row);
        if (activeFilter.status === "starred" && !starred.has(id))
          refreshList();
        updateHeaderAndCards();
      }

      function updateHeaderAndCards() {
        const stats = computeStats();
        renderHeader(stats);
        updateCatGrid(stats);
      }

      // ── Filter buttons ─────────────────────────────────────────────────────
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeFilter.status = btn.dataset.status;
          refreshList();
        });
      });

      document.getElementById("clear-btn").addEventListener("click", () => {
        if (confirm("Reset all progress and stars? This cannot be undone.")) {
          solved = new Set();
          starred = new Set();
          saveSet(STORAGE_KEY, solved);
          saveSet(STARRED_KEY, starred);
          localStorage.removeItem(STREAK_KEY);
          applyRowStates();
          refreshList();
          updateHeaderAndCards();
        }
      });

      // ── Init ───────────────────────────────────────────────────────────────
      buildCatGrid();
      buildList();
      const initStats = computeStats();
      renderHeader(initStats);
      updateCatGrid(initStats);
      refreshList();
    </script>
